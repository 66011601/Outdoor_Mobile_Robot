# vio_test_routes.yaml
# Route definitions for geometric_route_runner.py
#
# type:  'straight' — value in metres
#        'turn'     — value in degrees (positive = left/CCW, negative = right/CW)
#
# Run with:
#   ros2 run dcvg_robot geometric_route_runner --ros-args -p route:=A

# Route A — L-shape
# Straight 20 m, right 90°, straight 20 m
# Tests: straight-line drift + single 90° turn error
A:
  - {type: straight, value: 20.0}
  - {type: turn,     value: -90.0}
  - {type: straight, value: 20.0}

# Route B — Square (closed loop)
# 4 × (straight 10 m + right 90°)
# Tests: drift accumulation over 4 turns; end position should equal start
B:
  - {type: straight, value: 10.0}
  - {type: turn,     value: -90.0}
  - {type: straight, value: 10.0}
  - {type: turn,     value: -90.0}
  - {type: straight, value: 10.0}
  - {type: turn,     value: -90.0}
  - {type: straight, value: 10.0}

# Route C — Zigzag
# Diagonal segments with alternating turns
# Tests: drift on non-axis-aligned motion; ~62 m total path length
C:
  - {type: straight, value: 10.0}
  - {type: turn,     value: 45.0}
  - {type: straight, value: 14.14}
  - {type: turn,     value: -90.0}
  - {type: straight, value: 14.14}
  - {type: turn,     value: 45.0}
  - {type: straight, value: 10.0}

# GPS WPF CHANGES:
# - amcl params where removed. They are not needed because global localization is provided
#   by an ekf node on robot_localization fusing gps data with local odometry sources
# - static layer is removed from both costmaps, in this tutorial we assume there is no map
#   of the environment
# - global costmap is set to be rolling to allow the robot to traverse big environment by
#   following successive relatively close waypoints that fit in a smaller rolling costmap

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    # RPP invariant: rotateToHeading() zeroes linear_vel whenever the carrot is
    # within xy_goal_tolerance of the robot. odom_topic defaults to "odom", which
    # nothing in this stack publishes (the EKF publishes odometry/local) — RPP's
    # rotateToHeading() clamps angular accel against the last *measured* speed, so
    # a permanently-zero odom reading means rotation never ramps up. DWB never
    # read odom_topic, so this was latent until the RPP port surfaced it.
    odom_topic: odometry/local
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    # Both plugins are loaded simultaneously for A/B testing (see controller_type
    # launch arg in bringup.launch.py) — "FollowPath" is the id the custom BT XML
    # hardcodes (controller_id="FollowPath"), so whichever controller should be
    # ACTIVE must be the one named "FollowPath" here. RPP is now the default;
    # the original DWB config is preserved verbatim under "FollowPath_DWB" for
    # rollback/comparison, selected via a separate BT XML variant.
    controller_plugins: ["FollowPath", "FollowPath_DWB"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # After this many seconds without 0.5m progress, declare stuck →
      # BT triggers recovery (custom BT backs up before spinning) → if all
      # recoveries fail, waypoint is skipped (stop_on_failure: false in
      # waypoint_follower keeps the mission going).
      # Reduced from 15.0: don't grind against a depth-camera-only obstacle for
      # 15s. At cruising speed the robot still makes 0.5m easily; this only
      # fires when genuinely stuck, so recovery kicks in fast without lowering
      # the global max velocity.
      movement_time_allowance: 8.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 1.0m: robot declares "arrived" when within this range.
      # Handles goals placed inside/near obstacles — robot gets close, triggers
      # success, and waypoint follower advances to the next point.
      # Lowered from 1.5m to match the simpleRTK2B's actual field behavior: RTK
      # sits in FLOAT most of the time (~0.2-0.5m, worse on poor sky view) with
      # FIX (~1-2cm) coming and going — 1.0m keeps real margin over FLOAT-mode
      # noise without assuming FIX is continuously available. Re-tighten only
      # after confirming FIX duty cycle in the field (`ros2 topic echo /gps/fix`
      # covariance / carrier_soln), not from the FIX-mode number alone.
      xy_goal_tolerance: 1.0
      # Don't require the robot to align heading at each GPS waypoint
      yaw_goal_tolerance: 1.57
    # Regulated Pure Pursuit — ACTIVE controller (ported from sim validation).
    #
    # HARD INVARIANT: min_lookahead_dist must stay > general_goal_checker's
    # xy_goal_tolerance (now 1.0m above, tightened from 1.5m — see that comment
    # for why). If it doesn't, shouldRotateToGoalHeading() believes the carrot is
    # at/past the goal on every cycle (worse with use_velocity_scaled_lookahead_dist,
    # which collapses the carrot to min_lookahead_dist while stopped), calls
    # rotateToHeading() which hard-sets linear_vel=0, and the robot spins in place
    # forever — a self-sustaining deadlock, not a slow-tuning issue.
    # min_lookahead_dist is 1.2 (margin over 1.0, same ~20% buffer ratio as the
    # old 1.6-over-1.5), tightened from 1.6 now that the tolerance dropped —
    # this is the actual turn-radius lever (turn radius ~= lookahead^2 / (2*y)).
    # max_lookahead_dist dropped 3.0 -> 2.5 to also keep the carrot closer to
    # the depth camera's 3.0m obstacle-marking horizon (see local_costmap below).
    # NOTE: lookahead_dist (static) below is inert at runtime while
    # use_velocity_scaled_lookahead_dist is true — actual carrot distance is
    # desired_linear_vel * lookahead_time clamped to [min,max]_lookahead_dist,
    # i.e. ~1.25*1.5=1.875m at cruise. Kept set for clarity / fallback if
    # velocity scaling is ever disabled, not because it does anything today.
    #
    # inflation_cost_scaling_factor MUST equal the local costmap inflation_layer's
    # cost_scaling_factor for cost-regulated slowing to read distance-to-obstacle
    # correctly. That is 4.0 in this file (see local_costmap.inflation_layer
    # below), not 3.0 — set to 4.0 to match, flagged in the port report.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.25
      lookahead_dist: 1.5
      min_lookahead_dist: 1.2
      max_lookahead_dist: 2.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      inflation_cost_scaling_factor: 4.0
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 5.0
      use_interpolation: true

    # DWB parameters — preserved verbatim, still loaded (see controller_plugins
    # above) so it can be A/B'd against RPP via the controller_type launch arg
    # without editing this file. NOT the active plugin id ("FollowPath" is).
    FollowPath_DWB:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      # Reduced from 5.2: at 5.2 m/s the 8.84m simulated trajectory extends
      # beyond the 7m (3.5m radius) costmap — obstacles ahead are invisible.
      # At 1.5 m/s: sim_time 1.7s × 1.5 = 2.55m trajectory → fits comfortably.
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 1.5
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"] # ObstacleFootprint
      ObstacleFootprint.scale: 3.0
      # Raised from 0.5: obstacle cost was outvoted by the path-following
      # critics (PathAlign/PathDist 32.0) roughly 64:1, so DWB shaved past
      # obstacles instead of swinging around them. NOT the active controller
      # (RPP/FollowPath is default - see controller_type in bringup.launch.py);
      # kept correct here for when this is A/B'd via controller_type:=dwb.
      # If the robot weaves on open ground under that A/B, walk this back
      # toward 2.0 before touching the path scales.
      BaseObstacle.scale: 5.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# GPS WPF CHANGE: Remove static layer
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      # Matched to controller_frequency (20.0): /camera/depth/obstacles measured
      # ~29 Hz on hardware, so the sensor isn't the limiter here.
      update_frequency: 20.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.75
      plugins: ["stvl_layer", "denoise_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        # Voxels decay after this many seconds. Short decay is critical for VIO:
        # if the odom frame drifts slightly, old obstacle marks fade rather than
        # accumulating at wrong positions and blocking the robot.
        # Increased from 3.0: exponential decay at 3s fades obstacles in ~9s.
        # A slow robot can take longer than that to clear an obstacle, making
        # it disappear as "free" before the robot has actually passed.
        voxel_decay: 10.0
        decay_model: 0             # 0=linear — predictable, easier to reason about
        voxel_size: 0.05           # matches costmap resolution
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: True
        combination_method: 1      # 1=max cost wins across layers
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 20               # 20 × 0.05 = 1.0 m height band tracked
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        observation_sources: depth_obstacles
        depth_obstacles:
          data_type: PointCloud2
          topic: /camera/depth/obstacles
          marking: true
          clearing: true
          obstacle_range: 3.0
          raytrace_range: 4.0
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          voxel_filter: true
          clear_after_reading: true
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 2      # remove lone-pixel noise, keep real obstacles
        group_connectivity_type: 8 # 8-connected: diagonals count as same cluster
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # Widened from 1.0. robot_radius above is 0.75, so 1.0 left only 0.25m
        # of cost gradient outside the inscribed circle - RPP's cost-regulated
        # slowing (FollowPath.cost_scaling_dist: 0.6 below) barely had room to
        # see an obstacle before the robot was already on top of it. 2.0 gives
        # 1.25m of gradient, comfortably past cost_scaling_dist.
        # inflation_cost_scaling_factor in FollowPath (RPP) must keep matching
        # cost_scaling_factor above (both 4.0) - unaffected by this radius change.
        inflation_radius: 2.0
      always_send_full_costmap: True

# GPS WPF CHANGE: Remove static layer
# GPS WPF CHANGE: Set rolling global costmap with 50x50 size. See note below
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      # Raised from 1.0 - was the slowest stage in the replan chain. This is
      # the expensive one (100x100 @ 0.1m = 1M cells); re-check planner_server
      # CPU after. If it starts missing cycles, shrink width/height before
      # reverting this rate (a rolling global costmap only needs to span the
      # current pair of successive GPS waypoints).
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # 0.75 — RAISED from 0.65 to match local_costmap. They disagreed, and the
      # planner was the permissive one: it planned through gaps the controller's
      # costmap scored as collision, so RPP would drive up to a "valid" path and
      # stop. Reconciled UPWARD deliberately, to preserve the obstacle margin
      # rather than trim the local costmap down to meet the planner.
      # Geometry check (urdf/dcvg_robot.urdf.xacro): base collision box is
      # 1.0m x 0.65m, drive wheels centred at y=+-0.4 with 0.122m width, so the
      # widest extent is +-0.461m. True circumscribed radius for the 1.0 x 0.92m
      # envelope = sqrt(0.5^2 + 0.461^2) = 0.68m. 0.65 was therefore BELOW the
      # real chassis radius — geometrically wrong, not just inconsistent.
      # 0.75 keeps ~0.07m margin over 0.68 for GPS/VIO pose error, which matters
      # because the rover pivots in place (circumscribed radius is the governing
      # model during rotation).
      robot_radius: 0.75
      resolution: 0.1
      # When using GPS navigation you will potentially traverse huge environments which are not practical to
      # fit on a big static costmap. Thus it is recommended to use a rolling global costmap large enough to
      # contain each pair of successive waypoints. See: https://github.com/ros-planning/navigation2/issues/2174
      rolling_window: True
      width: 100
      height: 100
      origin_x: 50.0
      origin_y: 50.0
      # treat unknown cells as free so the planner goes straight instead of
      # hugging the edges of already-cleared space
      track_unknown_space: false
      # no static map
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: depth_obstacles
        depth_obstacles:
          topic: /camera/depth/obstacles
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.6
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # faster drop-off keeps inflation tight around actual obstacles
        cost_scaling_factor: 4.0
        inflation_radius: 1.0
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False
    # 2.0, not 20.0. This value only drives a warning: planner_server warns
    # "Planner loop missed its desired rate" whenever a solve exceeds
    # 1/expected_planner_frequency. At 20.0 that budget was 50ms, and NavFn over
    # this global costmap (100x100m at 0.1m = 1000x1000 cells) does not reliably
    # solve in 50ms on the Orin Nano while VIO and RTK compete for cores — so it
    # warned constantly and the log stopped being a useful signal.
    # Nothing actually asks for 20Hz: replanning is driven by the BT's
    # RateController, which is 2.0Hz in navigate_to_pose and 1.5Hz in
    # navigate_through_poses. 2.0 is the honest ceiling, so a warning now means
    # a genuinely slow solve rather than a misconfigured expectation.
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 2.0
    min_rotational_vel: 0.8
    rotational_acc_lim: 6.4

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.5, 0.0, 1.5]
    min_velocity: [-1.5, 0.0, -1.5]
    max_accel: [2.5, 0.0, 3.2]
    # Raised from -2.5/-3.2 (stopping distance ~0.45m -> ~0.33m at 1.5 m/s).
    # DWB's decel_lim_x is -5.0, so the smoother, not the controller, was the
    # bottleneck on an emergency stop. Stepped to -3.0/-3.6 rather than the
    # full -4.0/-4.5 target - verify the drivetrain accepts this without
    # skidding/faulting at low speed, kill-switch in hand, before going further.
    max_decel: [-3.0, 0.0, -3.6]
    odom_topic: "odometry/local"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

route_server:
  ros__parameters:
    use_sim_time: False
    # Path to the GeoJSON route graph file (set at launch time via RewrittenYaml)
    graph_filepath: ""
    route_frame: "map"
    base_frame: "base_link"
    # Radius within which the robot is considered to have reached a graph node
    boundary_radius_to_achieve_node: 2.5
    # Densify the nav_msgs/Path output with intermediate points along each edge
    densify: True
    # Nearest-neighbor search for start/goal-to-graph node matching
    enable_nn_search: True
    num_nearest_nodes: 4
    max_nn_search_iterations: 1000
    max_planning_time: 2.0
    max_prune_dist_from_edge: 1.5
    min_prune_dist_from_start: 0.5
    min_prune_dist_from_goal: 0.5
    # Edge cost functions (distance only for this simple demo)
    edge_cost_functions: ["DistanceScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
      weight: 1.0
    # Graph file loader plugin
    graph_file_loader: "GeoJsonGraphFileLoader"
    GeoJsonGraphFileLoader:
      plugin: "nav2_route::GeoJsonGraphFileLoader"

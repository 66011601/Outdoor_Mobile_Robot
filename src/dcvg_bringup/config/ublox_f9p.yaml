ublox_gps_node:
  ros__parameters:
    device: /dev/ttyGPS_movingbase
    frame_id: gps_link

    config_on_startup: false

    dynamic_model: portable
    fix_mode: auto
    dgnss_mode: 3
    sbas: false
    enable_ppp: false

    publish:
      all: false
      nav:
        pvt: true
        relposned: true

    inf:
      all: false

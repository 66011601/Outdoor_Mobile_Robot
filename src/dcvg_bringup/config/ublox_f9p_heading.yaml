ublox_gps_node_heading:
  ros__parameters:
    device: /dev/ttyGPS_rover
    frame_id: gps_heading_link

    uart1:
      baudrate: 460800

    config_on_startup: false

    dynamic_model: portable
    fix_mode: auto
    dgnss_mode: 3
    sbas: false
    enable_ppp: false

    publish:
      all: false
      nav:
        pvt: false
        relposned: true

    inf:
      all: false
